<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SignalX Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
background:#000;
font-family:Arial,sans-serif;
color:white;
}

.container{
max-width:1400px;
margin:auto;
padding:20px;
}

.logo{
font-size:42px;
font-weight:bold;
color:#facc15;
}

.tagline{
color:#888;
margin-top:5px;
}

.topbar{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

select{
background:#111;
color:white;
border:1px solid #333;
padding:12px;
border-radius:12px;
}

.card{
background:#111;
padding:25px;
border-radius:24px;
border:1px solid #222;
margin-top:20px;
}

.signal-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;
}

.signal{
background:#0b0b0b;
padding:20px;
border-radius:20px;
border:1px solid #333;
}

.buy{
color:#22c55e;
font-size:28px;
font-weight:bold;
}

.sell{
color:#ef4444;
font-size:28px;
font-weight:bold;
}

.hold{
color:#facc15;
font-size:28px;
font-weight:bold;
}

.price{
font-size:40px;
font-weight:bold;
color:#facc15;
margin-top:10px;
}

.warning{
background:#3b0000;
padding:14px;
border-radius:14px;
margin-top:20px;
color:#ffb3b3;
}

.info{
background:#00253b;
padding:14px;
border-radius:14px;
margin-top:15px;
color:#8fd3ff;
}

canvas{
margin-top:30px;
}

.footer{
text-align:center;
margin-top:40px;
color:#666;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
SignalX Pro
</div>

<div class="tagline">
AI Forex & Crypto Signal Platform
</div>

<div class="topbar">

<select id="pairSelect">

<option value="bitcoin">BTCUSDT</option>
<option value="ethereum">ETHUSDT</option>
<option value="solana">SOLUSDT</option>
<option value="ripple">XRPUSDT</option>
<option value="tether-gold">XAUUSD</option>

</select>

<select id="timeframe">

<option>15M</option>
<option>1H</option>
<option>4H</option>

</select>

<select id="chartType">

<option value="line">Line Chart</option>
<option value="bar">Candlestick Style</option>

</select>

</div>

<div class="card">

<h2>Realtime Market</h2>

<div class="price" id="livePrice">
Loading...
</div>

<div id="signalType" class="buy">
BUY
</div>

<div class="signal-grid">

<div class="signal">
<h3>Signal</h3>
<p id="signalText">Strong Buy</p>
</div>

<div class="signal">
<h3>Market</h3>
<p id="marketText">Bullish</p>
</div>

<div class="signal">
<h3>Action</h3>
<p id="actionText">Hold Position</p>
</div>

<div class="signal">
<h3>Entry</h3>
<p id="entryPrice">-</p>
</div>

<div class="signal">
<h3>Take Profit</h3>
<p id="tpPrice">-</p>
</div>

<div class="signal">
<h3>Stop Loss</h3>
<p id="slPrice">-</p>
</div>

<div class="signal">
<h3>Risk Reward</h3>
<p id="rrBox">-</p>
</div>

</div>

<div class="warning" id="warningBox">
⚠ High volatility detected
</div>

<div class="info" id="infoBox">
📈 Market stable
</div>

<canvas id="chart"></canvas>

</div>

<div class="footer">
© 2026 SignalX Pro — Global Trading Platform
</div>

</div>

<script>

const labels = [];
const prices = [];

const ctx =
document.getElementById('chart');

const chart = new Chart(ctx, {

type:'line',

data:{

labels:labels,

datasets:[{

label:'Price',

data:prices,

borderWidth:2,

tension:0.3,

pointRadius:0

}]

},

options:{

responsive:true,

plugins:{
legend:{
labels:{
color:'white'
}
}
},

scales:{

x:{
ticks:{
color:'white'
}
},

y:{
ticks:{
color:'white'
}
}

}

}

});

async function loadPrice(){

const pair =
document.getElementById('pairSelect').value;

const chartType =
document.getElementById('chartType').value;

chart.config.type = chartType;

try{

const response = await fetch(
'https://api.coingecko.com/api/v3/simple/price?ids='
+ pair +
'&vs_currencies=usd'
);

const data =
await response.json();

const price =
data[pair].usd;

document.getElementById('livePrice').innerHTML =
'$' + Number(price).toLocaleString();

const time =
new Date().toLocaleTimeString();

labels.push(time);
prices.push(price);

if(labels.length > 25){

labels.shift();
prices.shift();

}

chart.update();

generateSignal(price);

}catch(e){

document.getElementById('livePrice').innerHTML =
'Realtime Offline';

}

}

function generateSignal(price){

const signalType =
document.getElementById('signalType');

const signalText =
document.getElementById('signalText');

const marketText =
document.getElementById('marketText');

const actionText =
document.getElementById('actionText');

const entryBox =
document.getElementById('entryPrice');

const tpBox =
document.getElementById('tpPrice');

const slBox =
document.getElementById('slPrice');

const rrBox =
document.getElementById('rrBox');

const warningBox =
document.getElementById('warningBox');

const infoBox =
document.getElementById('infoBox');

const tf =
document.getElementById('timeframe').value;

const random =
Math.random();

let entry =
Number(price);

let tp;
let sl;

if(random > 0.66){

signalType.className='buy';
signalType.innerHTML='BUY';

signalText.innerHTML=
'Strong Buy';

marketText.innerHTML=
'Bullish Momentum';

actionText.innerHTML=
'Hold Until TP';

tp = entry * 1.015;
sl = entry * 0.993;

warningBox.innerHTML =
'⚠ Possible breakout movement';

infoBox.innerHTML =
'📈 Trend strong on ' + tf;

}

else if(random > 0.33){

signalType.className='sell';
signalType.innerHTML='SELL';

signalText.innerHTML=
'Strong Sell';

marketText.innerHTML=
'Bearish Pressure';

actionText.innerHTML=
'Exit Buy Position';

tp = entry * 0.985;
sl = entry * 1.008;

warningBox.innerHTML =
'⚠ News volatility detected';

infoBox.innerHTML =
'📉 Downtrend active on ' + tf;

}

else{

signalType.className='hold';
signalType.innerHTML='HOLD';

signalText.innerHTML=
'Sideways';

marketText.innerHTML=
'Low Volume';

actionText.innerHTML=
'Wait Confirmation';

tp = entry * 1.004;
sl = entry * 0.997;

warningBox.innerHTML =
'⚠ Sideways market detected';

infoBox.innerHTML =
'📢 Avoid entry';

}

entryBox.innerHTML =
'$' + entry.toLocaleString();

tpBox.innerHTML =
'$' + tp.toLocaleString();

slBox.innerHTML =
'$' + sl.toLocaleString();

const rr =
Math.abs(tp-entry) /
Math.abs(entry-sl);

rrBox.innerHTML =
'1 : ' + rr.toFixed(2);

drawLines(entry,tp,sl);

}

function drawLines(entry,tp,sl){

chart.data.datasets = [

{
label:'Market',

data:prices,

borderWidth:2,

tension:0.3,

pointRadius:0

},

{
label:'Entry',

data:new Array(labels.length).fill(entry),

borderWidth:1,

pointRadius:0

},

{
label:'TP',

data:new Array(labels.length).fill(tp),

borderWidth:1,

pointRadius:0

},

{
label:'SL',

data:new Array(labels.length).fill(sl),

borderWidth:1,

pointRadius:0

}

];

chart.update();

}

loadPrice();

setInterval(loadPrice,5000);

</script>

</body>
</html>
