<script>

const pairMap = {

bitcoin:'BTCUSDT',
ethereum:'ETHUSDT',
solana:'SOLUSDT',
ripple:'XRPUSDT',
'tether-gold':'XAUUSD',

};

const ctx =
document.getElementById('chart');

const labels = [];
const prices = [];

let chartType = 'line';

const chart = new Chart(ctx, {

type: chartType,

data:{

labels:labels,

datasets:[{

label:'Live Market',

data:prices,

borderWidth:2,

tension:0.3,

pointRadius:0

}]

},

options:{

responsive:true,

plugins:{

legend:{
labels:{
color:'white'
}
}

},

scales:{

x:{
ticks:{
color:'white'
}
},

y:{
ticks:{
color:'white'
}
}

}

}

});

async function loadPrice(){

const pair =
document.getElementById('pairSelect').value;

try{

const response = await fetch(
'https://api.coingecko.com/api/v3/simple/price?ids='
+ pair +
'&vs_currencies=usd'
);

const data = await response.json();

const price = data[pair].usd;

document.getElementById('livePrice').innerHTML =
'$' + Number(price).toLocaleString();

const time =
new Date().toLocaleTimeString();

labels.push(time);
prices.push(price);

if(labels.length > 25){

labels.shift();
prices.shift();

}

chart.update();

generateSignal(price);

}catch(e){

document.getElementById('livePrice').innerHTML =
'Realtime Offline';

}

}

function generateSignal(price){

const signalType =
document.getElementById('signalType');

const signalText =
document.getElementById('signalText');

const marketText =
document.getElementById('marketText');

const actionText =
document.getElementById('actionText');

const warningBox =
document.getElementById('warningBox');

const infoBox =
document.getElementById('infoBox');

const entryBox =
document.getElementById('entryPrice');

const tpBox =
document.getElementById('tpPrice');

const slBox =
document.getElementById('slPrice');

const rrBox =
document.getElementById('rrBox');

const tf =
document.getElementById('timeframe').value;

let entry =
Number(price);

let tp;
let sl;

const random =
Math.random();

if(random > 0.65){

signalType.className='buy';
signalType.innerHTML='BUY';

signalText.innerHTML=
'Strong Buy Signal';

marketText.innerHTML=
'Bullish Momentum';

actionText.innerHTML=
'Hold Until TP';

tp = entry * 1.015;
sl = entry * 0.992;

warningBox.innerHTML =
'⚠ Potential breakout in next few candles';

infoBox.innerHTML =
'📈 Trend strong on ' + tf;

}

else if(random > 0.35){

signalType.className='sell';
signalType.innerHTML='SELL';

signalText.innerHTML=
'Strong Sell Signal';

marketText.innerHTML=
'Bearish Pressure';

actionText.innerHTML=
'Exit Buy Position';

tp = entry * 0.985;
sl = entry * 1.008;

warningBox.innerHTML =
'⚠ High volatility / news impact detected';

infoBox.innerHTML =
'📉 Downtrend active on ' + tf;

}

else{

signalType.className='hold';
signalType.innerHTML='HOLD';

signalText.innerHTML=
'Sideways Market';

marketText.innerHTML=
'Low Volume';

actionText.innerHTML=
'Wait Confirmation';

tp = entry * 1.004;
sl = entry * 0.997;

warningBox.innerHTML =
'⚠ Sideways detected. Avoid entry';

infoBox.innerHTML =
'📢 Market ranging';

}

entryBox.innerHTML =
'$' + entry.toLocaleString();

tpBox.innerHTML =
'$' + tp.toLocaleString();

slBox.innerHTML =
'$' + sl.toLocaleString();

const rr =
Math.abs(tp-entry) /
Math.abs(entry-sl);

rrBox.innerHTML =
'1 : ' + rr.toFixed(2);

drawEntryLine(entry,tp,sl);

}

function drawEntryLine(entry,tp,sl){

chart.data.datasets = [

{
label:'Market',
data:prices,
borderWidth:2,
tension:0.3,
pointRadius:0
},

{
label:'Entry',
data:new Array(labels.length).fill(entry),
borderWidth:1,
pointRadius:0
},

{
label:'TP',
data:new Array(labels.length).fill(tp),
borderWidth:1,
pointRadius:0
},

{
label:'SL',
data:new Array(labels.length).fill(sl),
borderWidth:1,
pointRadius:0
}

];

chart.update();

}

function changeChart(){

const type =
document.getElementById('chartType').value;

chart.config.type = type;

chart.update();

}

loadPrice();

setInterval(loadPrice,5000);

</script>
